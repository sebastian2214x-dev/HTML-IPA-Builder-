name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr HTMLIPABuilder.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: "*.ipa"
